# Branche Neon par pull request : chaque PR obtient une copie de la base
# (preview/pr-<n>) sur laquelle ses migrations Drizzle sont appliquées,
# pour vérifier le schéma avant la fusion sans toucher à la production.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   NEON_API_KEY     — https://console.neon.tech/app/settings/api-keys
#   NEON_PROJECT_ID  — Neon → projet → Settings → General
# Sans ces deux secrets, le workflow se termine en succès avec un simple
# avertissement : il ne bloque ni ne pollue les PR.
#
# Note : l'ancienne version testait `secrets.*` dans un `if:` d'étape,
# ce que GitHub refuse — le fichier était invalide et chaque push
# s'affichait en échec. Les secrets sont désormais lus dans `env`.
name: Neon preview branches

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-and-migrate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier la configuration Neon
        id: cfg
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NEON_API_KEY / NEON_PROJECT_ID absents : branche de prévisualisation ignorée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'

      - name: Créer la branche Neon de la PR
        id: neon-branch
        if: steps.cfg.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.cfg.outputs.enabled == 'true'

      - name: Appliquer les migrations sur la branche de la PR
        if: steps.cfg.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: npm run db:migrate

      # Un seul commentaire, à l'ouverture : pas un par push.
      - name: Commenter la PR
        if: steps.cfg.outputs.enabled == 'true' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "preview/pr-" + context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Branche Neon \`${branch}\` créée et migrée pour cette PR.`,
            });

  delete:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration Neon
        id: cfg
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Supprimer la branche Neon de la PR
        if: steps.cfg.outputs.enabled == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
