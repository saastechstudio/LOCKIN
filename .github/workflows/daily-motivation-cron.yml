name: Daily motivation notification

# Notification quotidienne des membres, à partir de 10h (Europe/Paris).
# Le cron GitHub est en UTC et Paris alterne UTC+1 / UTC+2 : on se
# déclenche aux deux heures possibles. GitHub retarde souvent les crons
# de plusieurs heures ; on n'exige donc plus « exactement 10h », mais
# « 10h ou plus tard » à Paris. L'endpoint est idempotent (une seule
# notification par membre et par jour), deux appels sont sans effet.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the 10h-Paris check (manual test run)"
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier qu'il est au moins 10h à Paris
        id: check
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          hour=$(TZ="Europe/Paris" date +%-H)
          echo "Heure locale à Paris : $hour"
          if [ "$hour" -lt 10 ] && [ "$FORCE_RUN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call the daily-motivation endpoint
        if: steps.check.outputs.skip != 'true'
        run: |
          curl --fail --silent --show-error \
            -X POST "${APP_URL}/api/cron/daily-motivation" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Domaine Railway du service (l'ancien domaine f3ed n'avait pas de port : appels perdus).
          APP_URL: ${{ vars.APP_URL || 'https://lockin-production-2b84.up.railway.app' }}
